updates:
- date: '2026-11-19'
  change: 'Verified the complete relevant November EME workbook sheets: fieldwork November 10–12; annual
    December mean 6.792571428571428% and 35 participants, compared with October same-horizon mean 6.83%
    and 41 participants. November 30/December 31 policy medians are 12.25%. The workbook includes coarse
    inflation bins but no exact annual-November-above-6.30% YES share or December 18 rate-hike share.
    Keep first-release CPI outcomes and recorded forecasts unchanged.'
  source_url: https://suameca.banrep.gov.co/archivos/encuestas/encuesta_mensual_analistas_economicos/res_inf_nov2026.xlsx
- date: '2026-11-10'
  change: The exact October first-release bulletin reports annual inflation of 6.30%, above the unchanged
    6.29% threshold. The original 60% call resolves YES through the family resolver; its probability,
    baseline and cutoff remain unchanged. Monthly inflation is 0.20%; the small annual rise does not establish
    broad acceleration or forecasting calibration.
  source_url: https://www.dane.gov.co/files/operaciones/IPC/oct2026/bol-IPC-oct2026.pdf
- date: '2026-11-09'
  change: The November 6 official announcement reports a completed USD 2,000 million government purchase
    for reserve accumulation, distinct from the earlier authorization. Its captured headline does not
    establish liquidity treatment or peso effects; it does not change the policy rate or the recorded
    inflation forecast.
  source_url: https://www.banrep.gov.co/es/noticias/junta-directiva/banrep-compro-2000-millones-dolares-nov-2026
- date: '2026-11-06'
  change: The complete new minutes explain the October hold without promising easing. One director initially
    favored a cut before joining the hold majority; three favored a further increase. This later evidence
    does not rewrite the existing inflation call.
  source_url: https://www.banrep.gov.co/es/noticias/junta-directiva/minutas-banrep-octubre-2026
- date: '2026-11-04'
  change: The official exchange rate reaches COP 3,235.59 per dollar, a seven-day peso depreciation of
    2.78%. This November observation does not rewrite the immutable October inflation forecast or establish
    its outcome.
  source_url: https://www.datos.gov.co/Econom-a-y-Finanzas/Tasa-de-Cambio-Representativa-del-Mercado-TRM/32sa-8pi3
- date: '2026-11-02'
  change: Verified the October 30 hold at 12.25%; the frozen 65% hike call resolves NO. Recorded a separate
    prospective 60% October inflation-up call for November 9, against an explicitly uninformative 50/50
    baseline.
  source_url: https://www.banrep.gov.co/es/noticias/junta-directiva/junta-directiva-octubre-2026
- date: '2026-10-27'
  change: September annual inflation is 6.29%. The September 30 board decision raised the policy rate
    to 12.25%; the next decision is October 30.
  source_url: https://banrep.gov.co/es/noticias/junta-directiva/junta-directiva-septiembre-2026
