current_view:
  date: '2026-11-19'
  text: November’s official analyst survey, conducted November 10–12, puts mean annual December inflation
    at 6.79%, versus 6.83% in October’s survey, with 35 versus 41 respondents. This is an expectation,
    with different panels and unknown exact publication day. November and December month-end policy medians
    are 12.25%; neither establishes a December 18 hike probability. Observed October annual IPC remains
    6.30%, policy 12.25%, and November 19 TRM COP 3,326.96 per dollar.
  confidence: confirmed
next_trigger:
  date: '2026-12-07'
  event: DANE schedules November headline IPC for December 7 at 18:00 Bogotá; its family window opens
    November 30. BanRep’s December 18 decision window opens December 11. Require exact first-release outcomes;
    survey month-end columns do not establish board timing.
