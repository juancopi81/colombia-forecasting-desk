current_view:
  date: '2026-11-03'
  text: The official registry records approval of Articles 5 and 14 as in the report and
    rejected deletion propositions during the November 2 plenary. This establishes partial
    progress, not completed passage or adoption of the reserved-procurement clause. The
    previously verified committee text excludes infrastructure and territorial cofinancing;
    final procurement wording and disclosure effects remain unverified.
  confidence: confirmed
