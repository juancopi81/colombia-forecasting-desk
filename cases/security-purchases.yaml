schema_version: case_file.v1
case_id: security-purchases
plain_title: 'Ley de Sometimiento: security purchases'
plain_summary: Known publicly as Ley de Sometimiento, the bill sets conditions for illegal armed groups to surrender to the justice
  system. The House-approved version omits an earlier proposal to let the Interior Ministry
  buy certain security-sensitive goods and services directly for the military and police.
  Subsequent adopted versions and any enacted law need separate verification.
why_it_matters: Publication rules affect public oversight of security spending.
who_is_affected: Security agencies, suppliers and people monitoring public procurement.
