current_view:
  date: '2026-11-05'
  text: Gaceta 1716 publishes the complete House version and certifies approval with modifications
    on November 2–3, Acts 024 and 025. Its Articles 1–30 omit the FONSECON reserved-procurement provision
    previously present as committee Article 25. In this House version, Article 24 concerns criminal
    procedure and Article 25 policy monitoring. This establishes a House-stage text change, not Senate
    completion, enactment or repeal of existing procurement and secrecy rules.
  confidence: confirmed
