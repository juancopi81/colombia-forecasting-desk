case_id: security-purchases
plain_title: Publication rules for security purchases
plain_summary: Joint committees approved a narrower reserved-procurement mechanism. Infrastructure
  and territorial cofinancing are excluded; final plenary text and disclosure effects still
  need verification.
why_it_matters: Publication rules affect public oversight of security spending.
who_is_affected: Security agencies, suppliers and people monitoring public procurement.
