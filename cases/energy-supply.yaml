  text: "XM’s wholesale spot price rose from COP 564.34/kWh on November 22 to COP 858.47/kWh on November 23. Useful reservoir volume slipped from 76.07% to 75.98% on November 24–25. Demand fell from 257.79 GWh on November 20 to 244.32 GWh on November 21. The measures have separate clocks, and household tariff changes and supply risk remain unverified."
