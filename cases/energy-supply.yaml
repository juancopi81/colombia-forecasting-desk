  text: XM reports a November 9 spot electricity price of COP 383.13/kWh, above November 8’s COP 275.48/kWh. Reservoir useful volume is 78.74% on November 11, versus 79.07% on November 10. November 7 demand is 231.50 GWh, but this Saturday reading cannot establish a normalized demand trend against Friday. These different clocks establish no shortage, consumer-tariff change or supply restriction.
