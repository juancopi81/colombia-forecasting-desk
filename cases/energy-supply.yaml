case_id: energy-supply
plain_title: Gas and electricity supply
plain_summary: Supply rules, spot electricity prices and reservoirs can reveal pressure on households
  and productive activity. Price movements alone do not prove a shortage.
why_it_matters: Restrictions and supply costs can affect essential services and production.
who_is_affected: Households, industrial users, generators and distributors.
