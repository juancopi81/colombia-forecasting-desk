current_view:
  date: '2026-11-11'
  text: Gaceta 1755 publishes committee-approved supplementary 2026 budget text with
    COP 3.857426 trillion in additions and COP 1.466290 trillion in reallocations.
    Article 5 conditionally transfers unclaimed pension balances after three years
    to finance Colombia Mayor, preserving succession and indexed-return safeguards.
    This is committee text, not verified enactment or spending. The separate decrees'
    COP 13.8 trillion cut and COP 634.95 trillion 2027 budget remain unchanged.
  confidence: confirmed
next_trigger:
  date: null
  event: Final plenary or reconciled text and promulgated law establish whether the
    supplementary 2026 additions, reallocations and pension clause become law;
    committee publication alone does not establish enactment or execution.
