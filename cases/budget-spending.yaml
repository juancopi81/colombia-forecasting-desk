schema_version: case_file.v1
case_id: budget-spending
plain_title: The spending cut and next year’s budget
plain_summary: Existing decrees reduced 2026 appropriations and issued the 2027 budget. A published committee-approved supplementary 2026 bill adds and reallocates appropriations; final enactment and execution remain unverified.
why_it_matters: Budget authority can change public services and project funding.
who_is_affected: Public bodies, contractors and users of public services.
identifiers:
  bills:
  - PL 401/2026 Cámara
  - PL 280/2026 Senado
  decrees:
  - Decreto 1585/2026
  - Decreto 1599/2026
  indicator_ids:
  - fiscal_tax_pulse
  nits: []
  keywords:
  - presupuesto general
current_view:
  date: '2026-11-12'
  text: Committee-approved supplementary 2026 text adds COP 3.857426 trillion and reallocates COP 1.466290 trillion; its conditional unclaimed-pension clause is not verified law. Separately, the November 11 government-bond auction reports about COP 2.4 trillion issued and COP 8.09 trillion demand. Issuance does not establish budget execution or funding for that bill. The earlier COP 13.8 trillion cut and COP 634.95 trillion 2027 budget remain separate.
  confidence: confirmed
next_trigger:
  date: null
  event: Final plenary or reconciled text and promulgated law establish whether the supplementary 2026 additions, reallocations and pension clause become law; committee publication alone does not establish enactment or execution.
forecast_ids: []
status: active
park_after_days: 21
updates:
- date: '2026-11-12'
  change: The November 11 TES COP auction reports about COP 2.4 trillion issued across 2030, 2035, 2040 and 2058 maturities, with COP 8.09 trillion demand. This is observed financing, not evidence that appropriations were spent or that the supplementary bill was enacted. The source-published 6.7x cover uses an unspecified denominator and is not reconstructed from final issuance.
  source_url: https://www.irc.gov.co/documents/d/guest/subasta-19-cop-noviembre-11-de-2026?download=true
- date: '2026-11-11'
  change: Verified the complete supplementary-budget text on pages 1–2 of November 10 Gaceta 1755, identifying PL 401/2026 Cámara and 280/2026 Senado as approved in joint economic committees. It adds COP 3,857,426,000,000 and reallocates COP 1,466,289,786,310. The new pension clause requires specified absent heirs, three years without a qualifying claim and indexed return if claims arise. Final enactment, the exact committee vote date and execution remain unverified.
  source_url: https://svrpubindc.imprenta.gov.co/gacetas/index.xhtml?gaceta=1755
- date: '2026-11-02'
  change: The new weekly agenda schedules the supplementary 2026 budget bill for November 3 at 07:00 in joint economic commissions. Keep this separate from the existing decrees, royalties budget and economic-rescue proposal.
  source_url: https://www.camara.gov.co/wp-content/uploads/2026/11/AGENDA-LEGISLATIVA-SEMANA-DEL-2-AL-6-DE-NOVIEMBRE-DE-2026.pdf
- date: '2026-10-29'
  change: October 28 Gacetas 1663 and 1664 publish positive first-debate reports with modifications for the supplementary 2026 budget bill. The captured excerpts establish a report, not adoption, exact allocations or cash execution.
  source_url: https://svrpubindc.imprenta.gov.co/gacetas/index.xhtml?gaceta=1664
- date: '2026-10-27'
  change: The complete official edition checked on October 23 records a COP 13.8 trillion 2026 reduction and a COP 634.95 trillion 2027 budget. The decree states its basis for issuance; execution and legal validity need separate evidence.
  source_url: https://svrpubindc.imprenta.gov.co/diario?edicion=53.666
