case_id: budget-spending
plain_title: The spending cut and next year’s budget
plain_summary: The government reduced 2026 appropriations and issued the 2027 budget by decree.
  Implementation and legal questions remain separate from the existence of the instruments.
why_it_matters: Budget authority can change public services and project funding.
who_is_affected: Public bodies, contractors and users of public services.
