current_view:
  date: '2026-10-29'
  text: The complete official edition checked on October 23 records a COP 13.8 trillion
    2026 reduction and a COP 634.95 trillion 2027 budget. The decree states its basis
    for issuance. New October 28 reports favor a separate supplementary 2026 budget
    bill with modifications; they do not establish adoption. Execution and legal
    validity need separate evidence.
