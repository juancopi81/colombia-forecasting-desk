schema_version: case_file.v1
case_id: budget-spending
plain_title: The spending cut and next year’s budget
plain_summary: Budget decrees and distinct fiscal proposals change or could change public spending and
  household taxes. The economic-rescue bill proposes income-based VAT refunds; its adoption remains unverified,
  separately from the supplementary 2026 budget.
why_it_matters: Budget authority can change public services and project funding.
who_is_affected: Public bodies, contractors and users of public services.
