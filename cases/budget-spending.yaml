current_view:
  date: '2026-11-26'
  text: "The November 25 Treasury auction issued about COP 2.40 trillion, similar to November 11. Submitted demand fell from COP 8.09 trillion to COP 4.40 trillion. The accepted rate on the 2058 bond rose from 13.379% to 13.85%. The supplementary budget’s plenary outcome and amounts remain unverified after the November 25 agenda. The separate economic-rescue proposal remains in committee. The auction establishes financing terms for those securities."
  confidence: confirmed
next_trigger:
  date: null
  event: Certified adopted texts and final enactment establish the supplementary budget and economic-rescue
    provisions separately; a rapporteurs meeting, filed text or silence establishes neither outcome.
