updates:
- date: '2026-11-11'
  change: Verified the complete supplementary-budget text on pages 1–2 of November 10
    Gaceta 1755, identifying PL 401/2026 Cámara and 280/2026 Senado as approved in
    joint economic committees. It adds COP 3,857,426,000,000 and reallocates
    COP 1,466,289,786,310. The new pension clause requires specified absent heirs,
    three years without a qualifying claim and indexed return if claims arise.
    Final enactment, the exact committee vote date and execution remain unverified.
  source_url: https://svrpubindc.imprenta.gov.co/gacetas/index.xhtml?gaceta=1755
