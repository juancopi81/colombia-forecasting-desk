current_view:
  date: '2026-11-17'
  text: 'Third-quarter GDP grew 0.5% year on year but fell 0.8% from the previous quarter after seasonal/calendar
    adjustment. September original annual activity grew 1.44%, resolving the unchanged 55% call above -0.04%
    YES. A monthly rebound does not establish broad recovery: quarterly agriculture and manufacturing contracted.
    August activity was revised to -0.56%; the recorded threshold stays -0.04%. All new output estimates are
    preliminary.'
  confidence: confirmed
next_trigger:
  date: '2026-11-18'
  event: DANE schedules September imports at 10:00 Bogotá; require matching periods and valuations for trade-balance
    claims. National jobs on November 30 and later monthly activity will test breadth; no new GDP/ISE call
    after today’s releases.
