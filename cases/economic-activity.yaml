case_id: economic-activity
plain_title: Economic activity and jobs
plain_summary: Monthly activity, factories, shops, building permits, trade and employment reveal whether growth
  is broad and whether it is reaching workers.
why_it_matters: Weak output can affect employment, tax revenue and business demand.
who_is_affected: Workers, consumers, firms and public budgets.
