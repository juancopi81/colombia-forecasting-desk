current_view:
  date: '2026-10-30'
  text: September national unemployment fell to 8.0% from 8.2% a year earlier, while occupation
    stayed at 58.7% and participation fell from 63.9% to 63.8%. The 13-city unemployment rate
    instead rose to 8.3% from 8.1%. The national improvement does not establish a broad employment
    recovery; August activity and manufacturing remain weak.
  confidence: confirmed
next_trigger:
  date: '2026-11-13'
  event: DANE schedules manufacturing and retail releases for November 13 at 10:00 Bogotá,
    activity for November 17 at 10:00 and headline national jobs for November 30 at 10:00.
    Thematic labor releases on November 13 are distinct from national monthly jobs.
