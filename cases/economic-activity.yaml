current_view:
  date: '2026-11-19'
  text: DANE’s September goods deficit is USD 2,268.2 million FOB, versus USD 1,135.1 million a year earlier.
    Newly captured, this November 18 release fills yesterday’s gap; it is not CIF imports minus FOB exports.
    Nominal trade does not establish volume or investment. Q3 GDP +0.5% annually/-0.8% adjusted quarterly,
    real housing finance -12.7% annually and September original ISE +1.44% remain uneven. Recorded calls
    stay immutable.
  confidence: confirmed
next_trigger:
  date: '2026-11-30'
  event: DANE schedules national October jobs at 10:00 Bogotá; its family window opens November 23. Later
    comparable monthly activity and trade details will test breadth. No new call after published imports,
    housing financing or ISE.
