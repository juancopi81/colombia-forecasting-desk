updates:
- date: '2026-11-19'
  change: 'Captured the separate official monthly FOB goods balance released November 18: September deficit
    USD 2,268.2 million, versus USD 1,135.1 million in September 2025. This supersedes the prior coverage
    limitation for the balance itself; the warning against subtracting CIF imports from FOB exports still
    applies. The collector change is not a newly dated economic release or a first-release family resolver.
    Goods balance is distinct from the current account.'
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/comercio-internacional/balanza-comercial
- date: '2026-11-18'
  change: DANE’s November 18 imports page reports September goods imports of USD 8,192.8 million CIF,
    +33.7% year on year; manufacturing imports +28.6% and 72.8% of the total. Dollar-value growth is not
    a volume or productive-investment measure. September exports remain USD 5,410.7 million FOB/+16.4%;
    mixed valuations cannot establish a goods balance.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/comercio-internacional/importaciones
- date: '2026-11-18'
  change: The newly captured third-quarter housing-finance page reports purchase disbursements of COP
    6,969,388 million nominal and COP 2,848,519 million in real terms, down 12.7% year on year. Housing
    credit is COP 5,682,742 million and leasing COP 1,286,646 million. Disbursements are distinct from
    construction output, permits and house prices; do not extrapolate this contraction to the whole economy.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/construccion/financiacion-de-vivienda
- date: '2026-11-17'
  change: First September bulletin reports original annual ISE +1.44%, adjusted annual +1.52% and adjusted
    monthly +2.82%. Original annual primary activities -1.81%, secondary +2.34%, tertiary +1.93%. The
    existing November 10 call at 55% above -0.04% resolves YES through the resolver; prediction fields
    stay fixed. July revised +1.06% to +0.25%, August -0.04% to -0.56%; later revisions cannot change
    the first-release threshold or outcome. Preliminary estimates.
  source_url: https://www.dane.gov.co/files/operaciones/ISE/bol-ISE-sep2026.pdf
- date: '2026-11-17'
  change: 'Verified November 17 preliminary GDP bulletin: Q3 original real GDP +0.5% year on year, -0.8%
    seasonally/calendar-adjusted quarter on quarter, January–September +2.1%. Q3 agriculture -6.7%, manufacturing
    -1.2%, construction +0.6%, mining +7.8%. Q2 annual GDP revised +3.5% to +3.6%, Q1 +2.2% to +2.1%.
    Quarterly and year-to-date sector contributions must stay separate; monthly activity improvement does
    not establish sustained recovery.'
  source_url: https://www.dane.gov.co/files/operaciones/PIB/bol-PIB-IIItrim2026.pdf
- date: '2026-11-16'
  change: Recovered DANE’s November 13 September permit release missed by the headline parser. Total authorized
    area is 1,880,073 square metres, up 4.8% year on year; housing +1.0% and non-residential +17.1%. January–September
    total rises 10.8%. The complete bulletin identifies preliminary data, revised earlier months and formal
    permits that may never become construction; these figures do not resolve ISE or GDP.
  source_url: https://www.dane.gov.co/files/operaciones/ELIC/bol-ELIC-sep2026.pdf
- date: '2026-11-13'
  change: DANE September retail release reports real sales +9.7%, employment +1.2% and ex-fuel real sales
    +11.6% year on year. These are survey measures, not total household consumption or national employment.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/comercio-interno/encuesta-mensual-de-comercio-emc
- date: '2026-11-13'
  change: Verified September factory production +1.5%, real sales +0.6%, employment -1.4%, with 19 of
    39 activities expanding; retail real sales +9.7%, employment +1.2%. Complete EMMET bulletin page 3
    confirms the factory figures and page 5 reports January–September production +0.5%, employment -1.0%.
    Provisional data; landing label November 12 differs from PDF cover November 13. Its revised August
    chart cannot replace archived forecast evidence.
  source_url: https://www.dane.gov.co/files/operaciones/EMMET/bol-EMMET-sep2026.pdf
- date: '2026-11-10'
  change: Recorded the prospective November 17 September activity call at 55% that original-series annual
    ISE growth exceeds -0.04%, against an explicitly uninformative 50/50 baseline. Prior-month retail
    strength and slight national jobs improvement offset weak factories only modestly; this is a subjective
    estimate, not new September activity data or a calibration claim.
  source_url: https://www.dane.gov.co/index.php/calendario/icalrepeat.detail/2026/11/17/11151/-/indicador-de-seguimiento-a-la-economia-ise
- date: '2026-11-04'
  change: DANE reports September goods exports up 16.4% year over year to USD 5,410.7 million FOB. Different
    periods and valuations prevent combining this with August CIF imports into a September trade balance.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/comercio-internacional/exportaciones
- date: '2026-10-30'
  change: The original September GEIH bulletin reports national unemployment of 8.0%, below the 8.2% year-earlier
    threshold; the existing 35% internal call resolves YES. National occupation is unchanged and large-city
    unemployment worsens.
  source_url: https://www.dane.gov.co/files/operaciones/GEIH/bol-GEIH-sep2026.pdf
- date: '2026-10-27'
  change: The August activity index was 0.04% below a year earlier. Factory and retail readings diverge;
    one weak month does not establish a sustained contraction.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/cuentas-nacionales/indicador-de-seguimiento-a-la-economia-ise
