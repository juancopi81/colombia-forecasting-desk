updates:
- date: '2026-11-04'
  change: DANE reports September goods exports up 16.4% year over year to USD 5,410.7 million
    FOB. Different periods and valuations prevent combining this with August CIF imports
    into a September trade balance.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/comercio-internacional/exportaciones
- date: '2026-10-30'
  change: The original September GEIH bulletin reports national unemployment of 8.0%, below
    the 8.2% year-earlier threshold; the existing 35% internal call resolves YES. National
    occupation is unchanged and large-city unemployment worsens.
  source_url: https://www.dane.gov.co/files/operaciones/GEIH/bol-GEIH-sep2026.pdf
- date: '2026-10-27'
  change: The August activity index was 0.04% below a year earlier. Factory and retail readings
    diverge; one weak month does not establish a sustained contraction.
  source_url: https://www.dane.gov.co/index.php/estadisticas-por-tema/cuentas-nacionales/indicador-de-seguimiento-a-la-economia-ise
