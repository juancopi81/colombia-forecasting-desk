current_view:
  date: '2026-11-04'
  text: September goods exports reached USD 5,410.7 million FOB, up 16.4% from a year earlier.
    Nominal export growth does not establish a broad real-output recovery. Imports remain
    August CIF data, so a comparable September trade balance is unavailable. September
    national unemployment improved to 8.0%, with flat occupation and worse large-city
    unemployment; August activity and factories remain weak.
  confidence: confirmed
next_trigger:
  date: '2026-11-13'
  event: DANE schedules manufacturing and retail releases for November 13 at 10:00 Bogotá,
    activity for November 17 at 10:00 and headline national jobs for November 30 at 10:00.
    Thematic labor releases on November 13 are distinct from national monthly jobs.
