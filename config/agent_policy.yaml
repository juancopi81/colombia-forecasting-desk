# Agent policy for Colombia Forecasting Desk
# Defines constraints and defaults for LLM-assisted steps in the pipeline.

publishing:
  autonomous_publishing: false
  require_human_review: true

content:
  allowed_outputs:
    - daily_brief
    - candidate_questions
    - evidence_pack
    - forecast_draft
    - x_post_draft
    - agent_analysis
    - shadow_forecast
  prohibited_outputs:
    - investment_advice
    - trading_signals
    - betting_recommendations
    - automated_execution

sourcing:
  paywalled_sources: disallowed
  login_required_sources: disallowed
  max_sources_per_evidence_pack: 10

forecasting:
  min_evidence_items: 2
  require_resolution_criteria: true
  require_deadline: true
  confidence_levels:
    - low
    - medium
    - high

shadow_experiment:
  public: false
  ledger: forecasts/shadow_forecast_log.jsonl
  max_forecasts_per_run: 1
  target_forecasts_per_week: "1-3"
  quota_enforced: false
  require_exact_official_resolver: true
  require_resolution_deadline: true
  require_named_baseline: true
  require_human_review_before_public_migration: true
  public_forecast_log_mutation: prohibited
