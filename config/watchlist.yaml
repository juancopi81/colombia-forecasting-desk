    kind: public_entity
    label: Department of Antioquia (demo)
    active: true
    demo: true
    why: Demonstrate a departmental procurement history; this is not Juan's personal selection.
    identifiers:
      nit: '890900286-0'
      names: ['Departamento de Antioquia', 'Gobernación de Antioquia']
      divipola: ['05']
  - watch_id: demo-colombia-telecomunicaciones
    kind: company
    label: Colombia Telecomunicaciones (demo)
    active: true
    demo: true
    why: Demonstrate a large organizational supplier with verified public contracts.
    identifiers:
      nit: '830122566-1'
      names: ['Colombia Telecomunicaciones S.A. ESP BIC', 'Colombia Telecomunicaciones SA ESP']
