settings:
  window_months: 24
  group_limit: 500
  contract_id_limit: 500
  buyer_limit: 5
  thresholds:
    supplier_share: 0.25
    repeat_direct_award: 10
    large_addition_ratio: 0.50
    value_outlier_cop: 1000000000000
entries:
